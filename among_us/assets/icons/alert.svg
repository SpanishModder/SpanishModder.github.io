<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="256" height="256" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Marcador de tarea: exclamación amarilla en círculo</title>

  <!-- Círculo: fondo caqui con borde verde oscuro -->
  <circle cx="34" cy="34" r="32" fill="#d3ca6b" stroke="#434a2e" stroke-width="2.7"/>
  <circle cx="34" cy="34" r="29.9" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.2"/>

  <!-- Barra de la exclamación -->
  <g stroke-linejoin="round">
    <rect x="27.85" y="8.35" width="12.3" height="33.6" rx="1.2" fill="#e8e610" stroke="#14140a" stroke-width="2"/>
    <rect x="29" y="9.5" width="3.2" height="31.3" fill="#f7f53e"/>                 <!-- brillo izquierdo -->
    <path d="M37.6 9.5h1.4v31.3h-1.4z" fill="#b8b000"/>                              <!-- sombra derecha -->
    <path d="M30 38.4h8.4v2.4H30z" fill="#b8b000" fill-opacity=".55"/>               <!-- base de la barra -->
  </g>

  <!-- Punto -->
  <g stroke-linejoin="round">
    <circle cx="34" cy="53.6" r="5.3" fill="#dcd70c" stroke="#14140a" stroke-width="2"/>
    <path d="M38.3 54.8a4.5 4.5 0 0 1-8 2.1 4.5 4.5 0 0 0 8-2.1z" fill="#b8b000"/> <!-- sombra inferior -->
    <circle cx="32.2" cy="51.8" r="1.4" fill="#f7f53e"/>                              <!-- brillo -->
  </g>
</svg>
